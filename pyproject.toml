[project]
name = "omphalos"
version = "1.1.1"
description = "Codebase symbol index for LLMs"
readme = "README.md"
authors = [
    { name = "snui1s", email = "snailsqz@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pathspec>=1.1",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.0",
    "dotenv>=0.9.9",
]

[project.scripts]
omph = "omphalos.cli:app"
omphalos = "omphalos.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: typer.Option(...) เป็น idiom มาตรฐานของ Typer
"src/omphalos/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tree_sitter_python", "tree_sitter_typescript", "tree_sitter_javascript", "tree_sitter_go", "tree_sitter_rust"]
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
