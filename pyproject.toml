[project]
name = "omphalos"
version = "1.3.0"
description = "Codebase symbol index for LLMs"
readme = "README.md"
authors = [
    { name = "snui1s", email = "snailsqz@gmail.com" }
]
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "indexer", "tree-sitter", "ast", "codebase", "symbols", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12.0,<1",
    "pathspec>=1.1,<2",
    # tree-sitter packages are pre-1.0: a minor bump can change the API or node names, so cap each
    "tree-sitter>=0.24.0,<0.27",
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.0,<0.24",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-rust>=0.24.0,<0.25",
]

[project.urls]
Homepage = "https://github.com/snui1s/Omphalos"
Repository = "https://github.com/snui1s/Omphalos"
Issues = "https://github.com/snui1s/Omphalos/issues"
Changelog = "https://github.com/snui1s/Omphalos/blob/main/CHANGELOG.md"

[project.scripts]
omph = "omphalos.cli:app"
omphalos = "omphalos.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: typer.Option(...) เป็น idiom มาตรฐานของ Typer
"src/omphalos/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tree_sitter_python", "tree_sitter_typescript", "tree_sitter_javascript", "tree_sitter_go", "tree_sitter_rust"]
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
